<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/cat-number-match/play/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A cozy Number Match puzzle with your own cat.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cat Number Match">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cat Number Match</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #fdf4ec; }
    @media (prefers-color-scheme: dark) { html, body { background: #2a211c; } }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font: 15px/1.4 system-ui, sans-serif; color: #8a6a55; }
    #splash img { width: 96px; height: 96px; border-radius: 22px;
      animation: breathe 1.6s ease-in-out infinite; }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px;
      background: #f1dccb; overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%;
      background: #f39a63; border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(0.94); } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #splash img, #splash .bar i { animation: none; } }
  </style></head>
<body>
  <div id="splash" aria-live="polite">
    <img src="icons/app-icon.png" alt="">
    <div class="bar"><i></i></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash'); if (s) s.remove();
      try { parent.postMessage('cnm-game-ready', '*'); } catch (e) {}
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
